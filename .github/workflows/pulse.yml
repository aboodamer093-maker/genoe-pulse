name: genoe-pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '14 3 * * 1'

permissions:
  contents: write

concurrency:
  group: genoe-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pre-check core on host
        run: node free-truth-probe/genes/crosscheck.js --self-test

      - name: clear run-owned receipts (no stale reuse across runs)
        run: |
          rm -f free-truth-probe/genes/receipts/vein-a-safari.json \
                free-truth-probe/genes/receipts/vein-b-iosim.json \
                free-truth-probe/genes/receipts/vein-s-macos.json \
                free-truth-probe/genes/receipts/vein-h-safari.json \
                free-truth-probe/genes/receipts/vein-h-chrome.json \
                free-truth-probe/genes/receipts/vein-h-firefox.json \
                free-truth-probe/genes/receipts/hello-vein-a-safari.txt \
                free-truth-probe/genes/receipts/hello-vein-b-iosim.txt
          echo "run-owned receipts cleared"

      - name: vein-a — real macOS Safari
        run: |
          set +e
          node free-truth-probe/genes/vein-a-safari.js
          ec=$?
          if [ $ec -eq 0 ] || [ $ec -eq 5 ]; then echo "vein-a green (measurement captured)"; exit 0; fi
          echo "vein-a FAILED (exit $ec)"
          exit $ec

      - name: vein-b — real Mobile Safari (iOS simulator)
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/vein-b-iosim.js
          ec=$?
          if [ $ec -eq 0 ] || [ $ec -eq 5 ]; then echo "vein-b green (measurement captured)"; exit 0; fi
          echo "vein-b FAILED (exit $ec)"
          exit $ec

      - name: vein-s — real macOS Safari surface genes
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/vein-s-macos.js
          ec=$?
          if [ $ec -eq 0 ]; then echo "vein-s green (surface snapshot captured)"; exit 0; fi
          echo "vein-s FAILED (exit $ec)"
          exit $ec

      - name: vein-h — real macOS Safari h2 HEADERS blade
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/vein-h-safari.js
          ec=$?
          if [ $ec -eq 0 ]; then echo "vein-h-safari green (h2 headers captured)"; exit 0; fi
          echo "vein-h-safari FAILED (exit $ec)"
          exit $ec

      - name: vein-h — real macOS Chrome h2 HEADERS blade
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/vein-h-chrome.js
          ec=$?
          if [ $ec -eq 0 ]; then echo "vein-h-chrome green (h2 headers captured)"; exit 0; fi
          echo "vein-h-chrome FAILED (exit $ec)"
          exit $ec

      - name: vein-h — real macOS Firefox h2 HEADERS blade
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/vein-h-firefox.js
          ec=$?
          if [ $ec -eq 0 ]; then echo "vein-h-firefox green (h2 headers captured)"; exit 0; fi
          echo "vein-h-firefox FAILED (exit $ec)"
          exit $ec

      - name: seal — GENOE chain #1
        if: always()
        run: node free-truth-probe/genes/seal.js

      - name: persist sealed chain back to repo
        if: always()
        run: |
          git config user.name "GENOE Oracle"
          git config user.email "genoe@ghostburp.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no new beats to persist"
          else
            git commit -m "genoe: pulse beats ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:main
          fi

      - name: upload receipts + sealed beats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genoe-receipts
          path: |
            free-truth-probe/genes/receipts
            genoe/receipts
          if-no-files-found: warn