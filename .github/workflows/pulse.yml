name: genoe-pulse

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '14 3 * * 1'

permissions:
  contents: write

concurrency:
  group: genoe-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: self-check — core genes + chain (read-only, offline)
        run: |
          node free-truth-probe/genes/crosscheck.js --self-test
          node free-truth-probe/genes/cassette.js --self-test
          node free-truth-probe/genes/mspa.js
          node free-truth-probe/genes/chain-verify.js

      - name: clear run-owned receipts (no stale reuse across runs)
        run: |
          rm -rf free-truth-probe/genes/receipts/captured
          rm -f free-truth-probe/genes/receipts/vein-h-firefox.json \
                 free-truth-probe/genes/receipts/vein-h-iosim.json \
                 free-truth-probe/genes/receipts/hello-vein-a-safari.txt \
                 free-truth-probe/genes/receipts/hello-vein-b-iosim.txt \
                 free-truth-probe/genes/receipts/vein-v-chrome.json \
                 free-truth-probe/genes/receipts/vein-v-firefox.json \
                 free-truth-probe/genes/receipts/hello-vein-v-chrome.txt \
                 free-truth-probe/genes/receipts/hello-vein-v-firefox.txt \
                 free-truth-probe/genes/receipts/parity-curl.json
          rm -rf free-truth-probe/genes/receipts/wire-verify
          rm -rf free-truth-probe/genes/receipts/observer
          echo "run-owned receipts cleared"

      - name: measurement burst — ALL engines in parallel waves
        timeout-minutes: 40
        run: node free-truth-probe/genes/pulse-orchestrator.js

      - name: cross-observer witness matrix (public h2 observers, engines parallel)
        if: always()
        timeout-minutes: 15
        run: |
          set +e
          node free-truth-probe/genes/observer.js
          ec=$?
          # 0 = receipts written (witnessed or honest absence); 4 = nothing readable
          if [ $ec -eq 0 ] || [ $ec -eq 4 ]; then echo "vein-o receipts recorded (matrix verdict in logs)"; exit 0; fi
          echo "vein-o FAILED (exit $ec)"
          exit $ec

      - name: gene-gate report (chain, corpus, freshness, pseudo-order truth)
        if: always()
        run: |
          set +e
          node free-truth-probe/genes/gene-gate.js
          ec=$?
          # REPORT-ONLY: honesty is enforced structurally downstream (seal
          # aborts the chain on damage; wire-verify/exits and persist-assert
          # turn silent failures red). Gate logs always show the truth.
          echo "gene-gate report exit=$ec (see logs for stale/corrupt findings)"
          exit 0

      - name: seal — verify-then-seal GENOE chain
        if: always()
        run: node free-truth-probe/genes/seal.js

      - name: post-seal chain verification (genesis -> tip walk)
        run: node free-truth-probe/genes/chain-verify.js

      - name: persist sealed chain back to repo + ASSERT it landed
        if: always()
        run: |
          git config user.name "GENOE Oracle"
          git config user.email "genoe@ghostburp.local"
          git add -A
          # never erase tracked history: unstage deletions so receipts lineage
          # (crown external-verify, engine hello, etc.) survives every pulse
          DEL=$(git diff --cached --name-only --diff-filter=D)
          if [ -n "$DEL" ]; then git restore --staged $DEL; fi
          if git diff --cached --quiet; then
            echo "no new beats to persist"
          else
            git commit -m "genoe: pulse beats ($(date -u +%Y-%m-%dT%H:%MZ))"
            # self-heal races: a stale/finished run may push first; rebase and
            # retry instead of failing the persist lane
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main 2>/dev/null; then echo "persist pushed (attempt $i)"; break; fi
              echo "persist push failed (attempt $i) — rebase and retry"
              git pull --rebase origin main >/dev/null 2>&1 || true
            done
            # HONEST PERSIST: never claim a beat landed when it did not.
            git fetch origin main >/dev/null 2>&1 || true
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null)" ]; then
              echo "PERSIST RED: local HEAD != origin/main after 5 attempts"
              exit 1
            fi
            echo "persist verified: HEAD == origin/main"
          fi

      - name: upload receipts + sealed beats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genoe-receipts
          path: |
            free-truth-probe/genes/receipts
            genoe/receipts
          if-no-files-found: warn